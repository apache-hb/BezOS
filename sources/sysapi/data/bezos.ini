[binaries]
c = '${package.sysroot}/bin/clang'
cpp = '${package.sysroot}/bin/clang++'
c_ld = 'lld'
cpp_ld = 'lld'
ar = '${package.sysroot}/bin/llvm-ar'
strip = '${package.sysroot}/bin/llvm-strip'

[properties]
sys_root = '${package.sysroot}'

[constants]
common_compile_args = [
    '--target=x86_64-unknown-bezos',
    '--sysroot=${package.sysroot}',
    '-ffreestanding',
    '-fno-omit-frame-pointer',
    '-fdiagnostics-absolute-paths',
    '-fno-addrsig',
    '-fno-builtin',
    '-nostdlib',
    '-nostdlib++',
    '-fno-stack-protector',
    '-fno-stack-check',
    '-mno-red-zone',
    '-ffunction-sections',
    '-fdata-sections',
    '-fno-threadsafe-statics',
    '-fno-common',
    '-fshort-wchar',
    '-m64' ]

common_link_args = [
    '--target=x86_64-unknown-bezos',
    '--sysroot=${package.sysroot}',
    '-ffreestanding',
    '-nostartfiles',
    '-nostdlib',
    '-static' ]

[built-in options]
c_args = common_compile_args
cpp_args = common_compile_args + [ '-nostdinc++', ]

c_link_args = common_link_args
cpp_link_args = common_link_args + [ '-nostdlib++', ]

[host_machine]
system = 'bezos'
cpu_family = 'x86_64'
endian = 'little'
cpu = 'i686'
